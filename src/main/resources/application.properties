spring.application.name=Retail_Loan_Document_Completeness_Checker
server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=RetailLoanDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

app.storage.location=${APP_STORAGE_LOCATION:uploads}
app.camunda.enabled=${CAMUNDA_ENABLED:false}
app.camunda.process-id=${CAMUNDA_PROCESS_ID:retail-loan-document-completeness}
app.camunda.confirm-element-id=${CAMUNDA_CONFIRM_ELEMENT_ID:Activity_0462f5z}
camunda.client.mode=${CAMUNDA_CLIENT_MODE:simple}
camunda.client.zeebe.enabled=${app.camunda.enabled}
camunda.client.zeebe.gateway-url=${CAMUNDA_GRPC_ADDRESS:http://127.0.0.1:26500}
camunda.client.zeebe.base-url=${CAMUNDA_REST_ADDRESS:http://127.0.0.1:8088}
camunda.client.zeebe.prefer-rest-over-grpc=false
camunda.client.operate.base-url=${CAMUNDA_OPERATE_ADDRESS:http://127.0.0.1:8081}
camunda.client.tasklist.base-url=${CAMUNDA_TASKLIST_ADDRESS:http://127.0.0.1:8082}
# The 8.5 starter INFO message includes Environment contents; never log credentials.
logging.level.io.camunda.zeebe.spring.client.configuration.ZeebeClientProdAutoConfiguration=WARN
