spring.application.name=Retail_Loan_Document_Completeness_Checker
server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=RetailLoanDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Unit123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

app.storage.location=${APP_STORAGE_LOCATION:uploads}
app.camunda.enabled=${CAMUNDA_ENABLED:false}
app.camunda.process-id=${CAMUNDA_PROCESS_ID:retail-loan-document-completeness}
camunda.client.mode=simple
camunda.client.zeebe.gateway-url=${CAMUNDA_GATEWAY_URL:http://127.0.0.1:26500}