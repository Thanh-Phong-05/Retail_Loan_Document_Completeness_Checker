spring.datasource.url=jdbc:h2:mem:retail-loan-test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.storage.location=${java.io.tmpdir}/retail-loan-document-checker-tests
app.camunda.enabled=false
camunda.client.mode=simple
camunda.client.zeebe.gateway-url=http://127.0.0.1:26500

debug=false
logging.level.root=WARN
