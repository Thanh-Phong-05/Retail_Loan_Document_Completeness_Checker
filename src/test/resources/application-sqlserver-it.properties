spring.datasource.url=${CONFIRM_SQLSERVER_IT_JDBC_URL}
spring.datasource.username=${CONFIRM_SQLSERVER_IT_USER}
spring.datasource.password=${CONFIRM_SQLSERVER_IT_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.camunda.enabled=true
app.camunda.confirm-recovery-ms=600000
